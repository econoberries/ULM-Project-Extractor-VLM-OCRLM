name: Python offline tests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight orchestrator
        run: python -m pip install -e .
      - name: Validate SLURM test Bash syntax
        run: |
          bash -n slurm/check_environment.sbatch
          bash -n scripts/run_repeated_baselines.sh
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
