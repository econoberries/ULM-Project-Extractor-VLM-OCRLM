[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulm-extractor"
version = "0.1.0"
description = "OCRBench v2 English KIE benchmarking on SLURM: direct VLM and OCR + LM"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0,<7", "pandas>=2.0,<3"]

# CUDA-specific wheels are installed separately using requirements/helix-*.txt.
# Keep this file portable: PaddlePaddle GPU is an environment dependency,
# while PaddleOCR and torchvision are declared as actual pipeline dependencies.
[project.optional-dependencies]
vlm = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "transformers>=5.19.0,<6",
    "accelerate>=1.0",
    "Pillow>=10",
]
ocr = ["paddleocr>=3.0,<4"]
dev = ["pytest>=8.0"]

[project.scripts]
extractor = "ulm_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
