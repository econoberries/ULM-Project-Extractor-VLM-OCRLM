[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulm-extractor"
version = "0.1.0"
description = "OCRBench v2 English KIE benchmarking on SLURM: direct VLM and OCR + LM"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0,<7", "pandas>=2.0,<3"]

# CUDA-specific wheels are installed separately using requirements/helix-*.txt.
# Use separate virtual environments: .venv installs [vlm] for all LM workers,
# .venv-ocr installs [ocr] and PaddlePaddle GPU for the shared OCR worker.
# Never combine [vlm,ocr] with paddlepaddle-gpu in one environment.
[project.optional-dependencies]
vlm = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "transformers>=5.19.0,<6",
    "accelerate>=1.0",
    "Pillow>=10",
]
# Pin the PaddleOCR/PaddleX versions used by the current Helix benchmark.
# The PaddlePaddle GPU backend is installed separately from the cu130 index.
ocr = ["paddleocr==3.7.0", "paddlex==3.7.2"]
dev = ["pytest>=8.0"]

[project.scripts]
extractor = "ulm_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
