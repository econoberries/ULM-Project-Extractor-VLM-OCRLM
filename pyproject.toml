[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulm-extractor"
version = "0.1.0"
description = "SLURM-first OCRBench v2 English KIE benchmarking framework"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "pandas>=2.0,<3"]

[project.optional-dependencies]
vlm = ["torch>=2.4", "transformers>=5.0", "accelerate>=1.0", "Pillow>=10"]
ocr = ["paddleocr>=3.0,<4"]
dev = ["pytest>=8.0"]

[project.scripts]
extractor = "ulm_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
